name: "Catalog CI/CD"

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: us-east-1
  ECR_REPOSITORY: catalog-service
  CORE_REPO: "CloudExam2/Core"

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      ec2_instance_id: ${{ steps.set-outputs.outputs.INSTANCE_ID }}
      catalog_public_ip: ${{ steps.set-outputs.outputs.CATALOG_IP }}
    
    defaults:
      run:
        working-directory: ./terraform

    env:
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repo: ${{ github.event.repository.name }}
      TF_VAR_github_token: ${{ secrets.GH_PAT }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Export Infrastructure Data
        id: set-outputs
        run: |
          echo "INSTANCE_ID=$(terraform output -raw ec2_instance_id)" >> $GITHUB_OUTPUT
          echo "CATALOG_IP=$(terraform output -raw catalog_public_ip)" >> $GITHUB_OUTPUT

  deploy:
    needs: [terraform]
    runs-on: ubuntu-latest
    env:
      INSTANCE_ID: ${{ needs.terraform.outputs.ec2_instance_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        run: |
          docker build --no-cache -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Check instance is SSM-managed
        run: |
          echo "Instance: ${{ env.INSTANCE_ID }}"
          aws ec2 describe-instances --instance-ids "${{ env.INSTANCE_ID }}" \
            --query "Reservations[0].Instances[0].{State:State.Name,PublicIp:PublicIpAddress,Subnet:SubnetId}" \
            --output table
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ env.INSTANCE_ID }}" \
            --query "InstanceInformationList[0].{PingStatus:PingStatus,AgentVersion:AgentVersion}" \
            --output table || echo "WARNING: instance not registered with SSM yet (wait a few minutes after first boot)"

      - name: Update EC2 via SSM
        id: ssm_update
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --parameters 'commands=[
              "set -e",
              "docker stop catalog-app || true",
              "docker rm catalog-app || true",
              "docker system prune -af",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest",
              "docker run -d --name catalog-app -p 80:8000 ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest",
              "sleep 10",
              "docker ps -a",
              "curl -fsS --max-time 10 http://127.0.0.1/ || (docker logs catalog-app && exit 1)"
            ]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          echo "Waiting for Command $COMMAND_ID..."
          
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ env.INSTANCE_ID }}" --region ${{ env.AWS_REGION }} || echo "SSM_FAILED=true" >> $GITHUB_ENV

      - name: Fetch SSM Logs on Failure
        if: env.SSM_FAILED == 'true'
        run: |
          aws ssm get-command-invocation \
            --command-id ${{ env.COMMAND_ID }} \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Catalog public endpoint
        run: |
          IP="${{ needs.terraform.outputs.catalog_public_ip }}"
          echo "=========================================="
          echo "Catalog URL: http://${IP}/"
          echo "Swagger:     http://${IP}/docs"
          echo "=========================================="
          curl -v -fsS --max-time 15 "http://${IP}/" || {
            echo "FAILED: no response on port 80. Check deploy SSM logs and EC2 security group."
            exit 1
          }

  verify-in-vpc:
    needs: [terraform, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for startup
        run: sleep 20

      - name: Curl Catalog & Debug Logs
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ needs.terraform.outputs.ec2_instance_id }}"
          
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify and Debug" \
            --parameters '{"commands":["docker ps", "curl -fsS --max-time 10 http://127.0.0.1/ || (docker logs catalog-app && exit 1)"]}' \
            --output text \
            --query "Command.CommandId")
          
          # Wait but don't exit on failure yet so we can fetch logs
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json

  trigger-core-update:
    needs: [verify-in-vpc]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Core Workflow
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
          gh workflow run "Core CI/CD" --repo ${{ env.CORE_REPO }}