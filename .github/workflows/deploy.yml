name: Catalog Service CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: catalog-service
  CORE_REPO: "CloudExam2/CoreRepo"

jobs:
  provision:
    runs-on: ubuntu-latest
    outputs:
      ec2_instance_id: ${{ steps.set-outputs.outputs.INSTANCE_ID }}
      catalog_public_ip: ${{ steps.set-outputs.outputs.CATALOG_IP }}
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve
        env:
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_github_token: ${{ secrets.GH_PAT }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_catalog_backend_url: ${{ vars.CATALOG_BACKEND_URL || '' }}

      - name: Export Infrastructure Data
        id: set-outputs
        run: |
          echo "INSTANCE_ID=$(terraform output -raw ec2_instance_id)" >> $GITHUB_OUTPUT
          echo "CATALOG_IP=$(terraform output -raw catalog_public_ip)" >> $GITHUB_OUTPUT

  deploy:
    needs: [provision]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Update EC2 via SSM
        run: |
          INSTANCE_ID="${{ needs.provision.outputs.ec2_instance_id }}"
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters 'commands=[
              "docker stop catalog-app || true",
              "docker rm catalog-app || true",
              "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest",
              "docker run -d --name catalog-app -p 80:8000 -e DATABASE_URL=\"${{ secrets.DATABASE_URL }}\" ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"
            ]' \
            --region ${{ env.AWS_REGION }}

      - name: Verify Catalog public endpoint
        run: |
          sleep 10
          curl -fsS --max-time 10 http://${{ needs.provision.outputs.catalog_public_ip }}/

  verify-in-vpc:
    needs: [provision, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for startup
        run: sleep 20

      - name: Curl Catalog & Debug Logs
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ needs.provision.outputs.ec2_instance_id }}"
          
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify and Debug" \
            --parameters '{"commands":["docker ps", "curl -fsS --max-time 10 http://127.0.0.1/ || (docker logs catalog-app && exit 1)"]}' \
            --output text \
            --query "Command.CommandId")
          
          # Wait but don't exit on failure yet so we can fetch logs
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json

  trigger-core-update:
    needs: [verify-in-vpc]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Core Workflow
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token
          gh workflow run "Core CI/CD" --repo ${{ env.CORE_REPO }}